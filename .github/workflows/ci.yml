name: Clinical Safety & CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    name: Test Suite & 50 Adversarial Evals
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .
          pip install langgraph langchain-core opentelemetry-api opentelemetry-sdk langfuse httpx fastapi uvicorn pytest pytest-asyncio pytest-cov

      - name: Run Pytest Suite & Adversarial Evals
        run: |
          pytest --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=85

  docker-build:
    name: Multi-Stage Container Build
    needs: test-and-verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: looksmaxxing-guide:latest
