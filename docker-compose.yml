version: "3.8"

services:
  looksmaxxing-guide:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: looksmaxxing-guide-engine
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - HOST=0.0.0.0
      - PORT=8000
      - NCBI_EMAIL=team@looksmaxxing.guide
      - OTEL_SERVICE_NAME=looksmaxxing-evidence-engine
      - DATABASE_PATH=/app/data/state_store.db
    volumes:
      - app-data:/app/data
      - app-content:/app/dist/content
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  app-data:
    driver: local
  app-content:
    driver: local
